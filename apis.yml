aid: simplyinsured
name: Simplyinsured
description: >-
  SimplyInsured is a small-business health insurance brokerage and online enrollment
  platform. It aggregates medical, dental, and vision plans from major carriers, provides
  unbiased plan recommendations, and lets small employers compare, quote, and enroll their
  teams entirely online at no cost to the business. Founded in 2012 and backed by Y
  Combinator, SimplyInsured is frequently embedded as the health-insurance offering inside
  partner payroll and HR platforms. As of this enrichment pass the company exposes a
  consumer-facing web application and a support/help surface but publishes no public
  developer API, SDKs, OpenAPI, or developer portal.
